name: FamilyTigerPass
options:
  bundleIdPrefix: com.TuyetMaiDoThi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Alamofire:
    path: Vendor/Alamofire
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: FamilyTigerPass/Info.plist
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "3"
    PRODUCT_BUNDLE_IDENTIFIER: com.TuyetMaiDoThi.FamilyTigerPass
    PRODUCT_NAME: FamilyTigerPass
    DEVELOPMENT_TEAM: "33H8GRP43D"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MACCATALYST: NO
targets:
  FamilyTigerPass:
    type: application
    platform: iOS
    sources:
      - path: FamilyTigerPass
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
          - GoogleService-Info.plist
    resources:
      - path: FamilyTigerPass/Assets.xcassets
      - path: FamilyTigerPass/PrivacyInfo.xcprivacy
    dependencies:
      - package: Alamofire
      - sdk: AdServices.framework
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Family Tiger Pass
        PRODUCT_BUNDLE_IDENTIFIER: com.TuyetMaiDoThi.FamilyTigerPass
        PRODUCT_DISPLAY_NAME: Family Tiger Pass
        CODE_SIGN_ENTITLEMENTS: Config/FamilyTigerPass.entitlements
        DEVELOPMENT_TEAM: "33H8GRP43D"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  FamilyTigerPassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FamilyTigerPassUITests
    dependencies:
      - target: FamilyTigerPass
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.TuyetMaiDoThi.FamilyTigerPass.uitests
        PRODUCT_MODULE_NAME: FamilyTigerPassUITests
        DEVELOPMENT_TEAM: "33H8GRP43D"
        TEST_TARGET_NAME: FamilyTigerPass
        CODE_SIGN_ENTITLEMENTS: ""
  FamilyTigerPassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FamilyTigerPassTests
    dependencies:
      - target: FamilyTigerPass
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.TuyetMaiDoThi.FamilyTigerPass.tests
        PRODUCT_NAME: FamilyTigerPassTests
        PRODUCT_MODULE_NAME: FamilyTigerPassTests
        DEVELOPMENT_TEAM: "33H8GRP43D"
        TEST_TARGET_NAME: FamilyTigerPass
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  FamilyTigerPass:
    build:
      targets:
        FamilyTigerPass: all
        FamilyTigerPassUITests: [test]
    test:
      targets:
        - FamilyTigerPassUITests
      commandLineArguments:
        "UI-Testing": true
  UnitTests:
    build:
      targets:
        FamilyTigerPass: all
        FamilyTigerPassTests: [test]
    test:
      targets:
        - FamilyTigerPassTests
